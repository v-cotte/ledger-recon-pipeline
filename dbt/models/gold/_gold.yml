version: 2

models:
  - name: fct_trade_reconciliation
    description: >
      One row per trade, reconciled across exchange, ledger and provider statement.
      Each break gets a single status (checked in order of severity) and the USD
      exposure at stake.
    columns:
      - name: trade_id
        data_tests: [unique, not_null]
      - name: trade_date
        data_tests: [not_null]
      - name: recon_status
        description: matched, or the break type.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - matched
                  - missing_in_exchange
                  - missing_in_ledger
                  - duplicate_in_ledger
                  - missing_in_statement
                  - amount_mismatch
                  - fee_mismatch
                  - late_settlement
      - name: exposure_usd
        description: USD at stake for the break (0 when matched).
        data_tests: [not_null]

  - name: rpt_daily_reconciliation
    description: Daily reconciliation KPIs (match rate, breaks by type, exposure).
    columns:
      - name: breaks
        description: Number of breaks that day.
        data_tests:
          # A sudden jump in breaks usually means an upstream bug, not bad luck
          - elementary.column_anomalies:
              arguments:
                column_anomalies: [sum]
                timestamp_column: trade_date
                time_bucket: {period: day, count: 1}
                training_period: {period: day, count: 30}
                detection_period: {period: day, count: 2}
                anomaly_sensitivity: 3
              config:
                severity: warn
      - name: exposure_usd
        description: USD at stake in that day's breaks.
        data_tests:
          - elementary.column_anomalies:
              arguments:
                column_anomalies: [sum]
                timestamp_column: trade_date
                time_bucket: {period: day, count: 1}
                training_period: {period: day, count: 30}
                detection_period: {period: day, count: 2}
                anomaly_sensitivity: 3
              config:
                severity: warn
      - name: trade_date
        data_tests: [unique, not_null]
      - name: match_rate_pct
        data_tests: [not_null]
